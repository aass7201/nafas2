version: '3.8'

services:
  nafas2-bot:
    build: .
    container_name: nafas2-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    # للسيرفرات التي تحتاج health check
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

# للاستخدام:
# 1. عدل المتغيرات في هذا الملف أو مررها بـ -e
